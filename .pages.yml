# Pages CMS configuration — edit the site's content at https://app.pagescms.org
# Every section in src/content/ appears as a collection. Saving in the CMS commits
# to GitHub, and Cloudflare redeploys the site automatically.

media:
  input: src/assets/uploads
  output: ../../assets/uploads
  categories: [image]

content:
  - name: journal
    label: Journal
    description: "Notes, essays, observations, stories, ideas"
    type: collection
    path: src/content/journal
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: "Title"
        type: string
        required: true
      - name: date
        label: "Date"
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: description
        label: "Short description"
        type: text
        description: "Under 240 characters. Shown on cards, in search and link previews. Leave empty to use the first paragraph."
      - name: kind
        label: "Kind"
        type: select
        required: true
        default: "essay"
        options:
          values: [note, essay, observation, story, idea]
      - name: image
        label: "Main image"
        type: image
      - name: imageAlt
        label: "Main image — alt text"
        type: string
        description: "Required if you add a main image. Describe what is in the photo."
      - name: gallery
        label: "Gallery"
        type: object
        list: true
        fields:
          - name: src
            label: "Image"
            type: image
            required: true
          - name: alt
            label: "Alt text"
            type: string
            required: true
          - name: caption
            label: "Caption"
            type: string
      - name: video
        label: "Video"
        type: object
        fields:
          - name: url
            label: "Video URL"
            type: string
            description: "YouTube or Vimeo link, or a direct link to a video file."
          - name: poster
            label: "Poster image"
            type: image
          - name: caption
            label: "Caption"
            type: string
      - name: tags
        label: "Tags"
        type: string
        list: true
      - name: location
        label: "Location"
        type: object
        fields:
          - name: name
            label: "Place"
            type: string
          - name: country
            label: "Country"
            type: string
          - name: lat
            label: "Latitude"
            type: number
            description: "South is negative"
          - name: lng
            label: "Longitude"
            type: number
            description: "West is negative"
      - name: links
        label: "Links"
        type: object
        list: true
        fields:
          - name: label
            label: "Label"
            type: string
            required: true
          - name: url
            label: "URL"
            type: string
            required: true
      - name: featured
        label: "Featured on /home"
        type: boolean
        default: false
      - name: draft
        label: "Draft (hidden on the live site)"
        type: boolean
        default: false
      - name: body
        label: "Text"
        type: rich-text

